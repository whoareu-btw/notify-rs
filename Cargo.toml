[package]
name = "notify-rs"
version = "0.1.1"
edition = "2021"
description = "Zero-dependency notification center for Wayland: notification daemon, media card, waybar modules"
license = "MIT"

# No [dependencies] on purpose: D-Bus, Wayland, fonts, PNG and JPEG are all
# implemented in this crate, on top of std only.

[lib]
name = "notify_rs"
path = "src/lib.rs"

[[bin]]
name = "notify-rs"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
